name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit runtime and build dependencies
        run: npm audit --audit-level=high
      - name: Verify source and Windows package
        run: npm run verify
      - name: Smoke Desktop shell online and offline against Dev
        run: npm run smoke:offline
      - name: Smoke native access cleanup
        run: npm run smoke:access
      - name: Build and verify versioned update artifact
        shell: pwsh
        env:
          TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          if ($env:TARGET_BRANCH -eq 'master') {
            npm run dist:prod:test
            npm run verify:dist:prod:test
          } else {
            npm run dist:dev:test
            npm run verify:dist:dev:test
          }
      - name: Upload unsigned test distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: uinventario-desktop-${{ github.sha }}-TEST-UNSIGNED
          path: |
            dist/*-test/*.exe
            dist/*-test/*.exe.blockmap
            dist/*-test/dev.yml
            dist/*-test/latest.yml
          if-no-files-found: error
          retention-days: 7
