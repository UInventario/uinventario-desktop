<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UInventario sin conexión</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #f4f7fb;
        color: #172033;
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        margin: 0;
      }
      main {
        width: min(34rem, calc(100% - 3rem));
        padding: 2.5rem;
        border: 1px solid #d9e1ef;
        border-radius: 1rem;
        background: white;
        box-shadow: 0 1rem 3rem rgb(23 32 51 / 10%);
      }
      h1 {
        margin-top: 0;
        font-size: 1.5rem;
      }
      p {
        line-height: 1.6;
        color: #4d5d78;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>UInventario no pudo conectarse</h1>
      <p>
        Comprueba tu conexión y vuelve a abrir la aplicación. El soporte de arranque completamente offline se
        incorporará junto con la persistencia y sincronización segura del cliente Desktop.
      </p>
    </main>
  </body>
</html>
